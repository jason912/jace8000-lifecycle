<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-label="Niagara IoT distributed asset control architecture diagram">
  <rect width="940" height="400" fill="#ffffff"/>
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <text x="30" y="42" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#0f172a">Distributed asset control architecture</text>
  <text x="30" y="66" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#64748b">分布式资产控制架构 · 多子系统边缘编排，本地连续性 + 集中可视化</text>

  <!-- enterprise platform top -->
  <rect x="290" y="90" width="360" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="470" y="118" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#1e3a8a">Enterprise monitoring platform</text>
  <text x="470" y="140" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#3b82f6">企业监控平台 · 设备集群分析</text>

  <!-- IoT controller middle -->
  <rect x="330" y="205" width="280" height="66" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="470" y="232" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1e3a8a">Niagara IoT</text>
  <text x="470" y="253" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1d4ed8">本地控制与编排</text>

  <!-- remote assets bottom -->
  <rect x="60" y="310" width="200" height="62" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="160" y="336" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#0f172a">Remote asset 1</text>
  <text x="160" y="356" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#64748b">EV charging / retail</text>

  <rect x="370" y="310" width="200" height="62" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="470" y="336" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#0f172a">Remote asset 2</text>
  <text x="470" y="356" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#64748b">fuel / refrigeration</text>

  <rect x="680" y="310" width="200" height="62" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="780" y="336" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#0f172a">Remote asset 3</text>
  <text x="780" y="356" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#64748b">lighting / HVAC</text>

  <!-- arrows -->
  <line x1="470" y1="200" x2="470" y2="164" stroke="#475569" stroke-width="1.8" marker-end="url(#a3)"/>
  <text x="482" y="188" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#64748b">structured data</text>

  <line x1="200" y1="305" x2="400" y2="276" stroke="#475569" stroke-width="1.8" marker-end="url(#a3)"/>
  <line x1="470" y1="305" x2="470" y2="276" stroke="#475569" stroke-width="1.8" marker-end="url(#a3)"/>
  <line x1="740" y1="305" x2="540" y2="276" stroke="#475569" stroke-width="1.8" marker-end="url(#a3)"/>

  <text x="30" y="34" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#94a3b8"> </text>
</svg>
