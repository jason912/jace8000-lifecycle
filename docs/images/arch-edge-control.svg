<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" width="940" height="430" role="img" aria-label="Niagara IoT edge control architecture diagram">
  <rect width="940" height="430" fill="#ffffff"/>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <text x="30" y="42" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#0f172a">Edge control architecture</text>
  <text x="30" y="66" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#64748b">边缘控制架构 · 单站点：现场设备 → Niagara IoT → 企业级系统 / 云平台</text>

  <!-- field devices -->
  <rect x="30" y="130" width="210" height="150" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="135" y="160" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#0f172a">Field devices</text>
  <text x="135" y="180" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#475569">现场设备</text>
  <text x="50" y="208" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#334155">· BACnet</text>
  <text x="50" y="230" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#334155">· Modbus RTU</text>
  <text x="50" y="252" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#334155">· I/O (IO-R modules)</text>

  <!-- Niagara IoT -->
  <rect x="330" y="110" width="280" height="190" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="470" y="142" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#1e3a8a">Niagara IoT</text>
  <text x="470" y="163" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#3b82f6">powered by Niagara Framework®</text>

  <rect x="352" y="180" width="76" height="34" rx="17" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="390" y="202" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1e3a8a">集成</text>
  <rect x="436" y="180" width="76" height="34" rx="17" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
  <text x="474" y="202" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#ffffff">控制</text>
  <rect x="520" y="180" width="76" height="34" rx="17" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="558" y="202" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1e3a8a">可视化</text>

  <text x="352" y="242" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#334155">· Deterministic control logic, executed locally</text>
  <text x="352" y="262" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#334155">· Alarming &amp; history on board</text>
  <text x="352" y="282" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#334155">· Browser-based operator access</text>

  <!-- enterprise -->
  <rect x="700" y="130" width="210" height="150" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="805" y="160" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#0f172a">Enterprise / Cloud</text>
  <text x="805" y="180" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#475569">企业级系统 / 云平台</text>
  <text x="720" y="210" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#334155">· Supervisor</text>
  <text x="720" y="232" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#334155">· Cloud / analytics</text>
  <text x="720" y="254" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#334155">· Standardised data</text>

  <!-- arrows -->
  <line x1="245" y1="205" x2="322" y2="205" stroke="#475569" stroke-width="1.8" marker-end="url(#a1)"/>
  <line x1="615" y1="205" x2="692" y2="205" stroke="#475569" stroke-width="1.8" marker-end="url(#a1)"/>
  <text x="268" y="196" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#64748b">integrate</text>
  <text x="628" y="196" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#64748b">publish</text>

  <!-- resilience note -->
  <rect x="30" y="330" width="880" height="66" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="48" y="356" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#92400e">Runs standalone when the WAN is down</text>
  <text x="48" y="378" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#92400e">广域网中断时保持本地控制与运行连续性；恢复后继续向企业平台发布数据。</text>
  <text x="620" y="356" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#92400e">WAN — — — ✕ — — —</text>
</svg>
